name: WaveLog ENS — Spread ECMWF
on:
  schedule:
    # GitHub se salta muchas ejecuciones programadas, así que cada ejecución se queda
    # vigilando ~6 h (mira cada 10 min si ECMWF ha sacado un run nuevo) y las del cron
    # solo sirven para relevarla. Como mucho una queda en cola (concurrency).
    - cron: '20 * * * *'
  workflow_dispatch:
concurrency:
  group: ens
  cancel-in-progress: false
jobs:
  ens:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install eccodes numpy
      - name: Descargar ENS y guardar en Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -u scripts/ens.py --vigilar
