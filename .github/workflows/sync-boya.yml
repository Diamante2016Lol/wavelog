name: Sync Boya Barcelona

on:
  schedule:
    # Portus publica cada hora ~30-35 min después (el de las 10:00 sale ~10:35).
    # Dos pasadas por hora; además cada pasada rellena las últimas 48 h, así que
    # si GitHub se salta alguna ejecución no se pierde nada.
    - cron: '41 * * * *'
    - cron: '56 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: |
          echo '{"name":"wavelog","version":"1.0.0","type":"module"}' > package.json
          npm install @supabase/supabase-js ws

      - name: Ejecutar sync de la boya
        run: node scripts/sync-boya.mjs
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
